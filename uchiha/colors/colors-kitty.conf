# Kitty color scheme generated by matugen
# Based on Material You colors

# The basic colors
foreground              #dee3e6
background              #0f1416
selection_foreground    #003642
selection_background    #86d1e9

# Cursor colors
cursor                  #86d1e9
cursor_text_color       #003642

# URL underline color when hovering with mouse
url_color               #c1c4eb

# Kitty window border colors
active_border_color     #86d1e9
inactive_border_color   #40484b
bell_border_color       #ffb4ab

# Tab bar colors
active_tab_foreground   #b2ebff
active_tab_background   #004e5f
inactive_tab_foreground #bfc8cc
inactive_tab_background #40484b
tab_bar_background      #0f1416

# Colors for marks (marked text in the terminal)
mark1_foreground #0f1416
mark1_background #86d1e9
mark2_foreground #0f1416
mark2_background #b3cad3
mark3_foreground #0f1416
mark3_background #c1c4eb

# The 16 terminal colors
# These use "on_*" roles which Material You guarantees have contrast

# black — darkest surface / readable surface
color0 #40484b
color8 #899296


# red — error
color1 #ffb4ab
color9 #ffdad6

# green — tertiary
color2  #c1c4eb
color10 #dfe0ff

# yellow — secondary
color3  #b3cad3
color11 #cee6f0

# blue — primary
color4  #86d1e9
color12 #b2ebff

# magenta — tertiary variant
color5  #c1c4eb
color13 #dfe0ff

# cyan — secondary variant
color6  #b3cad3
color14 #cee6f0

# white — always readable foreground
color7  #dee3e6
color15 #dee3e6
