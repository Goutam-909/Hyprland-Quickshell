# Source matugen colors instead of pywal
source = ~/.config/uchiha/colors/colors.conf

general {
    # Gaps and border
    gaps_in = 4
    gaps_out = 5
    gaps_workspaces = 50

    border_size = 1
    col.active_border = rgba(F7DCDE39)
    col.inactive_border = rgba(31313600)
    resize_on_border = true

    no_focus_fallback = true
    #layout=scrolling

    allow_tearing = true # This just allows the `immediate` window rule to work

    snap {
        enabled = true
        window_gap = 4
        monitor_gap = 5
        respect_gaps = true
    }
}

windowrule = border_color rgba(FFB2BCAA) rgba(FFB2BC77), match:pin 1
group {
    col.border_active = $primary $tertiary 45deg
    col.border_inactive = $surface_container $background 45deg
    col.border_locked_active = $primary $tertiary 45deg
    col.border_locked_inactive = $surface_container $background 45deg
}

decoration {
    rounding = 18
    blur {
        enabled = true
        xray = false
        special = false
        new_optimizations = true
        size = 4
        passes = 4
        brightness = 1
        noise = 0
        contrast = 1
        popups = true
        popups_ignorealpha = 0.58
        input_methods = true
        input_methods_ignorealpha = 0.8
    }
    shadow {
        enabled = true
        ignore_window = true
        range = 50
        offset = 0 4
        render_power = 10
        color = rgba(00000027)
    }
    # Dim
    dim_inactive = true
    dim_strength = 0.025
    dim_special = 0.07
}
